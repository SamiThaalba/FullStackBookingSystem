app.jwt.secret=${APP_JWT_SECRET:change-this-secret-key-change-this-secret-key-123456}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:900000}
app.admin.username=${APP_ADMIN_USERNAME:admin}
