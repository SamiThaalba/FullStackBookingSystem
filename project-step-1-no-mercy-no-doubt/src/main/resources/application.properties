spring.application.name=tourism-booking

# Local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tourism_booking
spring.datasource.username=postgres
spring.datasource.password=wwe123asd

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
